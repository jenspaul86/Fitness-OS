<script>

const clone=o=>JSON.parse(JSON.stringify(o)); const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); const $=q=>document.querySelector(q);
function usable(x){return x&&typeof x==='object'&&(Array.isArray(x.history)||Array.isArray(x.sessions)||x.plan||x.PLan)}
function migrate(){let current;try{current=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};if(current)return current;let found=null;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k===KEY)continue;try{const x=JSON.parse(localStorage.getItem(k));if(usable(x)&&(/fitness|workout|training|alpha/i.test(k)||x.history||x.sessions)){found=x;break}}catch{}}const s=found||{};return {tab:'Training',settings:s.settings||{},history:s.history||s.sessions||[],plan:s.plan||s.PLAN||clone(DEFAULT_PLAN),notes:s.notes||{},migrated:!!found}}
const S=migrate();S.settings??={};S.history??=[];S.plan??=clone(DEFAULT_PLAN);S.notes??={};S.images??={};S.timerSound??='signal';S.planEditDay??='A';
function planDayKeys(plan=PLAN()){return Object.keys(plan||{}).filter(k=>Array.isArray(plan[k]))}
function dayLabel(k){return 'Tag '+k}
function nextDayKey(plan=PLAN()){
  const used=new Set(planDayKeys(plan));
  for(const k of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ')if(!used.has(k))return k;
  let n=1;while(used.has('T'+n))n++;return 'T'+n
}
function normalizePlanDays(){
  for(const rec of Object.values(S.plans||{})){
    rec.plan??={A:[]};
    const ks=Object.keys(rec.plan).filter(k=>Array.isArray(rec.plan[k]));
    if(!ks.length)rec.plan.A=[];
  }
  syncActivePlanPointer();
  if(!PLAN()[S.planEditDay])S.planEditDay=planDayKeys()[0]||'A';
}

if(!S.plans||typeof S.plans!=='object'||Array.isArray(S.plans)||!Object.keys(S.plans).length){

}
if(!S.activePlan||!S.plans[S.activePlan])S.activePlan=Object.keys(S.plans)[0];
S.plan=S.plans[S.activePlan].plan;
let day='A',idx=0,sets=[],timerId=null,seconds=0,timerTargetMs=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));save(); const PLAN=()=>S.plan;
function activePlanRecord(){return S.plans[S.activePlan]}

}

}

}

}

function sessionVolume(h){
  return (h?.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).reduce((s,x)=>s+(Number(x.kg)||0)*(Number(x.reps)||0),0),0)

    const pct=pv?((vol-pv)/pv*100):0;
    const sign=pct>0?'↗ ':pct<0?'↘ ':'→ ';

    const pdiff=(Number(latest.pain)||0)-(Number(prev.pain)||0);
    compare=`${sign}Volumen ${pct>=0?'+':''}${pct.toFixed(1).replace('.',',')} % · RPE ${rdiff===0?'unverändert':(rdiff>0?'+':'')+rdiff} · Schmerz ${pdiff===0?'unverändert':(pdiff>0?'+':'')+pdiff}`;
  }

function workoutSwipeStart(e){
  const t=e.target;
  if(t.closest('input,textarea,select,button'))return;
  const touch=e.changedTouches?.[0];
  if(!touch)return;
  swipeStartX=touch.clientX;
  swipeStartY=touch.clientY;
}
function workoutSwipeEnd(e){
  if(swipeStartX==null||swipeStartY==null)return;
  const touch=e.changedTouches?.[0];
  if(!touch){swipeStartX=swipeStartY=null;return}
  const dx=touch.clientX-swipeStartX;
  const dy=touch.clientY-swipeStartY;
  swipeStartX=swipeStartY=null;
  if(Math.abs(dx)<55)return;
  if(Math.abs(dx)<=Math.abs(dy)*1.2)return;
  stashCurrentExercise();
  if(dx<0 && idx<PLAN()[day].length-1){idx+=1;renderExercise()}
  else if(dx>0 && idx>0){idx-=1;renderExercise()}
}
function ensureWorkoutSwipe(){
  const w=$('#workout');
  if(!w||w.dataset.swipeBound==='1')return;
  w.addEventListener('touchstart',workoutSwipeStart,{passive:true});
  w.addEventListener('touchend',workoutSwipeEnd,{passive:true});
  w.dataset.swipeBound='1';
}

function weightStepFor(kg){return kg>=100?5:kg>=40?2.5:1}
function progressionRecommendation(name,planReps,planRir,planKg,count){
  const prev=last(name);if(!prev?.sets?.length)return {kg:planKg,reps:planReps,rir:planRir,reason:'Startwerte aus deinem Plan'};
  const ss=prev.sets.filter(s=>s.done!==false),load=Number(ss[0]?.kg??planKg),reps=ss.map(s=>Number(s.reps)||0),rirs=ss.map(s=>Number(s.rir));
  const allHit=ss.length>=Math.min(count,1)&&reps.every(r=>r>=Number(planReps))&&rirs.every(r=>!Number.isFinite(r)||r>=Number(planRir));
  const minReps=reps.length?Math.min(...reps):0,avg=reps.length?reps.reduce((a,b)=>a+b,0)/reps.length:0;
  if(allHit){const next=Math.round((load+weightStepFor(load))*2)/2;return {kg:next,reps:Math.max(1,Number(planReps)-2),rir:planRir,reason:`Ziel erreicht → Gewicht steigern (${load} kg → ${next} kg)`}}
  if(avg>=Number(planReps)-1){return {kg:load,reps:Number(planReps),rir:planRir,reason:'Fast am Wiederholungsziel → gleiche Last, Zielwiederholungen vollmachen'}}
  if(minReps<Number(planReps)-3 && rirs.some(r=>Number.isFinite(r)&&r<Number(planRir))){const next=Math.max(0,load-weightStepFor(load));return {kg:next,reps:Number(planReps),rir:planRir,reason:'Leistung deutlich unter Ziel → Last leicht reduzieren'}}
  return {kg:load,reps:Math.min(Number(planReps),Math.max(...reps)+1),rir:planRir,reason:'Gleiche Last → mindestens eine Wiederholung mehr anpeilen'}
}


function activeSetIndex(){
  const i=sets.findIndex(s=>!s.done);
  return i<0?Math.max(0,sets.length-1):i
}
function liveSetRecommendation(i){
  const def=PLAN()[day]?.[idx];
  if(!def)return null;
  const [name,count,planReps,planRir,planKg]=def;
  const historic=progressionRecommendation(name,planReps,planRir,planKg,count);
  const completed=sets.slice(0,i).filter(s=>s.done);
  if(!completed.length)return {...historic,reason:'Empfehlung aus deinem letzten Training'};
  const lastSet=completed[completed.length-1];
  const load=Number(lastSet.kg)||Number(planKg)||0;
  const reps=Number(lastSet.reps)||0;
  const rir=Number(lastSet.rir);
  const targetReps=Number(planReps)||1,targetRir=Number(planRir)||0,step=weightStepFor(load);

  if(reps>=targetReps && Number.isFinite(rir) && rir>=targetRir+1){
    const next=Math.round((load+step)*2)/2;
    return {kg:next,reps:Math.max(1,targetReps-1),rir:targetRir,reason:'Letzter Satz klar über Ziel → Last erhöhen'}
  }
  if(reps>=targetReps && (!Number.isFinite(rir)||rir>=targetRir)){
    return {kg:load,reps:targetReps,rir:targetRir,reason:'Ziel getroffen → Last halten'}
  }
  if((Number.isFinite(rir)&&rir<targetRir)||reps<=targetReps-2){
    const next=Math.max(0,Math.round((load-step)*2)/2);
    return {kg:next,reps:targetReps,rir:targetRir,reason:'Unter Ziel → Last leicht reduzieren'}
  }
  return {kg:load,reps:Math.min(targetReps,reps+1),rir:targetRir,reason:'Knapp unter Ziel → gleiche Last, +1 Wdh.'}
}
function applyLiveRecommendation(i){
  const rec=liveSetRecommendation(i);
  if(!rec||!sets[i])return;
  sets[i].kg=rec.kg;sets[i].reps=rec.reps;sets[i].rir=rec.rir;
  stashCurrentExercise();renderSets()
}
function liveRecommendationHtml(i){
  const rec=liveSetRecommendation(i);
  if(!rec)return '';
  return `<button type="button" class="set-recommendation" data-apply-live-rec="${i}">
    <span class="rec-target">🎯</span>

}

${[60,90,120,150,180,240,300].map(v=>`<option value="${v}" ${Number(rest)===v?'selected':''}>${v} Sek.</option>`).join('')}

function pickerConfig(field){
  return field==='kg'?{label:'Gewicht',unit:'kg',step:2.5,min:0,max:500}:
         field==='reps'?{label:'Wiederholungen',unit:'Wdh',step:1,min:1,max:100}:
         {label:'RIR',unit:'RIR',step:.5,min:0,max:10}
}
function showSetValuePicker(i,field){
  const cfg=pickerConfig(field),current=Number(sets[i]?.[field])||0;
  const vals=[];
  for(let n=-4;n<=4;n++){
    let v=Math.round((current+n*cfg.step)*100)/100;
    v=Math.max(cfg.min,Math.min(cfg.max,v));
    if(!vals.includes(v))vals.push(v)
  }
  showModal(`<div class="value-picker">
    <div class="picker-head"><button type="button" data-picker-cancel>Abbrechen</button><b>${cfg.label}</b><span></span></div>
    <div class="picker-list">${vals.map(v=>`<button type="button" data-picker-value="${v}" data-picker-set="${i}" data-picker-field="${field}" class="${v===current?'active':''}">${v} ${cfg.unit}</button>`).join('')}</div>
    <div class="picker-direct">
      <input id="pickerDirect" type="number" inputmode="decimal" step="${cfg.step}" min="${cfg.min}" max="${cfg.max}" value="${current}">
      <button type="button" class="primary" data-picker-confirm="${i}" data-picker-field="${field}">✓</button>
    </div>
  </div>`)
}
function applySetPicker(i,field,value){
  const cfg=pickerConfig(field);
  let v=Number(value);
  if(!Number.isFinite(v))return;
  v=Math.max(cfg.min,Math.min(cfg.max,v));
  sets[i][field]=v;
  stashCurrentExercise();
  hideModal();
  renderSets()
}

function renderSets(){
  const active=activeSetIndex();
  $('#setRows').innerHTML=sets.map((x,i)=>`<div class="set-block ${i===active&&!x.done?'active':''}">
    <div class="row">
      <label>${i+1}</label>
      <input readonly inputmode="none" value="${x.kg}" data-pick-set="${i}" data-pick-field="kg" aria-label="Gewicht">
      <input readonly inputmode="none" value="${x.reps}" data-pick-set="${i}" data-pick-field="reps" aria-label="Wiederholungen">
      <input readonly inputmode="none" value="${x.rir}" data-pick-set="${i}" data-pick-field="rir" aria-label="RIR">
      <button class="${x.done?'good':''}" data-done="${i}">✓</button>
    </div>
    ${i===active&&!x.done?liveRecommendationHtml(i):''}

let timerMedia=null,timerMediaPrimed=false;
let timerAudioCtx=null;

function ensureTimerMedia(kind=S.timerSound){
  if(!kind||kind==='off'||!TIMER_MEDIA_DATA[kind])return null;
  if(!timerMedia)timerMedia=new Audio();
  if(timerMedia.src!==TIMER_MEDIA_DATA[kind]){timerMedia.src=TIMER_MEDIA_DATA[kind];timerMedia.load()}
  timerMedia.preload='auto';
  timerMedia.playsInline=true;
  return timerMedia
}
function primeTimerMedia(kind=S.timerSound){
  const a=ensureTimerMedia(kind);
  if(!a)return;
  try{
    a.volume=.001;
    a.currentTime=0;
    const pr=a.play();
    if(pr?.then)pr.then(()=>{setTimeout(()=>{try{a.pause();a.currentTime=0;a.volume=1;timerMediaPrimed=true}catch(_){}},35)}).catch(()=>{});
  }catch(_){}
}
function playTimerMedia(kind=S.timerSound){
  const a=ensureTimerMedia(kind);
  if(!a)return Promise.reject();
  try{
    a.pause();a.currentTime=0;a.volume=1;
    return a.play()||Promise.resolve()
  }catch(e){return Promise.reject(e)}
}

function ensureTimerAudio(){
  try{
    if(navigator.audioSession)navigator.audioSession.type='ambient';
    if(!timerAudioCtx){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(Ctx)timerAudioCtx=new Ctx()
    }
    if(timerAudioCtx?.state==='suspended')timerAudioCtx.resume();
  }catch(_){}
}
function tone(freq,start,duration,gain=.16,type='sine'){
  if(!timerAudioCtx)return;
  const o=timerAudioCtx.createOscillator();
  const g=timerAudioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,timerAudioCtx.currentTime+start);
  g.gain.setValueAtTime(0.0001,timerAudioCtx.currentTime+start);
  g.gain.exponentialRampToValueAtTime(gain,timerAudioCtx.currentTime+start+.015);
  g.gain.exponentialRampToValueAtTime(0.0001,timerAudioCtx.currentTime+start+duration);
  o.connect(g).connect(timerAudioCtx.destination);
  o.start(timerAudioCtx.currentTime+start);
  o.stop(timerAudioCtx.currentTime+start+duration+.03);
}

let timerPreviousAudioSessionType=null;
function beginAlarmAudioSession(){
  try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(_){}
}
function endAlarmAudioSession(){
  try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(_){}
  timerPreviousAudioSessionType=null;
}

function playTimerSound(kind=S.timerSound){
  if(!kind||kind==='off')return;
  beginAlarmAudioSession();
  ensureTimerAudio();
  const a=ensureTimerMedia(kind);
  if(a)a.volume=.58;
  const oscillatorFallback=()=>{
    if(!timerAudioCtx){endAlarmAudioSession();return}
    if(kind==='signal'){
      tone(880,0,.18,.18,'square');tone(880,.24,.18,.18,'square');tone(1175,.48,.28,.22,'square');
    }else if(kind==='double'){
      tone(740,0,.22,.17,'sine');tone(1046,.28,.3,.20,'sine');
    }else if(kind==='bell'){
      tone(1046,0,.65,.16,'sine');tone(1568,.03,.5,.12,'sine');tone(2093,.06,.38,.08,'sine');
    }else if(kind==='low'){
      tone(440,0,.24,.18,'triangle');tone(440,.3,.24,.18,'triangle');tone(523,.6,.35,.22,'triangle');
    }
  };
  playTimerMedia(kind).catch(oscillatorFallback);
  setTimeout(endAlarmAudioSession,1600);
}
function flashTimerFinished(){
  const el=$('#timerFlash');
  if(!el)return;
  el.classList.remove('flash-active');
  void el.offsetWidth;
  el.classList.add('flash-active');
  setTimeout(()=>el.classList.remove('flash-active'),1500);
}
function timerFinishedAlert(){
  flashTimerFinished();
  if(!timerAudioCtx||timerAudioCtx.state==='suspended')playTimerSound();
  if(navigator.vibrate)navigator.vibrate([120,80,120,80,180]);
}

let scheduledAlarmNodes=[];
function cancelScheduledAlarm(){for(const n of scheduledAlarmNodes){try{n.stop()}catch(_){}}scheduledAlarmNodes=[]}
function scheduleTimerAlarm(delaySec){
  cancelScheduledAlarm();ensureTimerAudio();if(!timerAudioCtx||S.timerSound==='off')return;
  try{
    if(navigator.audioSession)navigator.audioSession.type='ambient';
    if(timerAudioCtx.state==='suspended')timerAudioCtx.resume();
    const t0=timerAudioCtx.currentTime+Math.max(.05,Number(delaySec)||0);
    const seq=S.timerSound==='low'?[[440,0,.22],[440,.3,.22],[523,.6,.34]]:
      S.timerSound==='bell'?[[1046,0,.5],[1568,.04,.35]]:
      S.timerSound==='double'?[[740,0,.22],[1046,.3,.32]]:
      [[880,0,.17],[880,.24,.17],[1175,.48,.28]];
    for(const [freq,off,dur] of seq){
      const o=timerAudioCtx.createOscillator(),g=timerAudioCtx.createGain();
      o.type=S.timerSound==='signal'?'square':'sine';o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,t0+off);
      g.gain.exponentialRampToValueAtTime(.22,t0+off+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t0+off+dur);
      o.connect(g).connect(timerAudioCtx.destination);
      o.start(t0+off);o.stop(t0+off+dur+.03);scheduledAlarmNodes.push(o)
    }
  }catch(_){}
}

function syncTimerFromClock(){
  if(timerTargetMs==null)return;
  seconds=Math.ceil((timerTargetMs-Date.now())/1000);
}
function adjustRunningTimer(deltaSeconds){
  const delta=Number(deltaSeconds)||0;
  if(timerTargetMs==null){
    seconds+=delta;

function download(data,name){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  a.rel='noopener';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{
    try{a.remove()}catch(_){}
    URL.revokeObjectURL(url);
  },2500)
}

async function copyTextRobust(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true
    }
  }catch(_){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');ta.remove();return !!ok
  }catch(_){return false}
}

  reader.onload=()=>{const key=exerciseImageKey(targetIndex,targetDay);if(!key)return;S.images[key]=reader.result;save();e.target.value='';delete e.target.dataset.exerciseDay;if($('#workout')?.classList.contains('show'))renderExercise();else app()};
  reader.readAsDataURL(file)
});


document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && timerTargetMs!=null)paintTimer();
});
window.addEventListener('pageshow',()=>{
  if(timerTargetMs!=null)paintTimer();
});


document.addEventListener('pointerdown',()=>{ensureTimerAudio();primeTimerMedia()}, {once:true,passive:true});

app();
</script>
<div id="timerFlash" aria-hidden="true"></div>
</body></html>
